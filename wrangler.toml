# Cloudflare Pages project config (static site + /functions + D1).
name = "pdfquick-forms"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pdfquick-forms"
# Replace with the id printed by: npx wrangler d1 create pdfquick-forms
database_id = "88c0f8a2-4be2-4115-8672-822c14d0cc7c"
migrations_dir = "migrations"

# Non-secret settings. Secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, LICENSE_SECRET,
# RESEND_API_KEY) go in the Cloudflare dashboard or `wrangler pages secret put` — never here.
[vars]
PAYMENTS_ENABLED = "false"
# Stripe as merchant of record (tax, fraud, disputes). Requires accepting Managed Payments terms in the Dashboard.
STRIPE_MANAGED_PAYMENTS = "true"
PUBLIC_ORIGIN = "https://pdfquick-forms.pages.dev"
EMAIL_FROM = ""
